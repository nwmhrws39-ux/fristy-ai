name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["desktop/package.json", ".github/workflows/build-windows.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether to release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # Publish unless a complete, non-draft release with the installer already exists
            # (a draft or empty release left by a transient GitHub error is retried).
            COMPLETE=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
              --jq '(.isDraft | not) and ([.assets[].name | select(endswith("-x64.exe"))] | length > 0)' 2>/dev/null || echo false)
            if [ "$COMPLETE" = "true" ]; then
              echo "Release v$VERSION already complete - building without publishing."
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Backend venv + tests
        timeout-minutes: 15
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -q -r backend/requirements-dev.txt
          .venv/Scripts/python.exe -m pytest -q -p no:cacheprovider --timeout=90 --timeout-method=thread -o faulthandler_timeout=100

      - name: Frontend tests
        working-directory: desktop
        run: |
          npm ci || npm install
          npm test

      - name: Build installer (npm run dist)
        run: npm run dist

      - name: SHA-256 checksum (verified by the in-app updater)
        working-directory: desktop/release
        run: |
          for f in FRISTY-AI-Setup-*.exe; do sha256sum "$f" > "$f.sha256"; cat "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: FRISTY-AI-Setup
          path: |
            desktop/release/FRISTY-AI-Setup-*.exe
            desktop/release/FRISTY-AI-Setup-*.exe.sha256
          retention-days: 30

      - name: Release notes from CHANGELOG.md
        if: steps.ver.outputs.release == 'true'
        run: node scripts/release_notes.mjs "${{ steps.ver.outputs.version }}"

      - name: Publish GitHub Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          EXE=$(ls desktop/release/FRISTY-AI-Setup-*-x64.exe)
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "FRISTY AI ${{ steps.ver.outputs.version }}" --notes-file release-notes.md
          fi
          # Upload with retries; the release only becomes public after both files are in place.
          for i in 1 2 3 4; do
            if gh release upload "$TAG" "$EXE" "$EXE.sha256" --clobber --repo "$GITHUB_REPOSITORY"; then ok=1; break; fi
            echo "upload attempt $i failed, retrying..."; sleep 30
          done
          [ "${ok:-}" = 1 ] || { echo "Upload failed"; exit 1; }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
