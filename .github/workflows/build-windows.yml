name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backend venv + tests
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -q -r backend/requirements-dev.txt
          .venv/Scripts/python.exe -m pytest -q

      - name: Frontend tests
        working-directory: desktop
        run: |
          npm ci || npm install
          npm test

      - name: Build installer (npm run dist)
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: FRISTY-AI-Setup
          path: desktop/release/FRISTY-AI-Setup-*.exe
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/FRISTY-AI-Setup-*.exe
          generate_release_notes: true
