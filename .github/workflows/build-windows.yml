name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["desktop/package.json", ".github/workflows/build-windows.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether to release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release v$VERSION already exists - building without publishing."
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Backend venv + tests
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -q -r backend/requirements-dev.txt
          .venv/Scripts/python.exe -m pytest -q

      - name: Frontend tests
        working-directory: desktop
        run: |
          npm ci || npm install
          npm test

      - name: Build installer (npm run dist)
        run: npm run dist

      - name: SHA-256 checksum (verified by the in-app updater)
        working-directory: desktop/release
        run: |
          for f in FRISTY-AI-Setup-*.exe; do sha256sum "$f" > "$f.sha256"; cat "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: FRISTY-AI-Setup
          path: |
            desktop/release/FRISTY-AI-Setup-*.exe
            desktop/release/FRISTY-AI-Setup-*.exe.sha256
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: FRISTY AI ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            desktop/release/FRISTY-AI-Setup-*.exe
            desktop/release/FRISTY-AI-Setup-*.exe.sha256
          generate_release_notes: true
